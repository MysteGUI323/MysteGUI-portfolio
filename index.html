<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MysteGUI | Art Portfolio & Commissions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f1115;
            color: #e2e8f0;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Masonry Layout */
        .gallery-grid {
            column-count: 1;
            column-gap: 1.5rem;
        }
        @media (min-width: 640px) { .gallery-grid { column-count: 2; } }
        @media (min-width: 1024px) { .gallery-grid { column-count: 3; } }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 0.75rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            break-inside: avoid;
            margin-bottom: 1.5rem;
            display: inline-block;
            width: 100%;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .gallery-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 1.5rem 1rem 1rem;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .gallery-item:hover .gallery-overlay {
            transform: translateY(0);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f1115; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        .modal-enter { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        /* Dynamic Ambient Background */
        @keyframes float {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .bg-blob {
            position: fixed;
            filter: blur(90px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out alternate;
            z-index: -1;
            border-radius: 50%;
            pointer-events: none;
        }
        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #3730a3; }
        .blob-2 { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: #1e1b4b; animation-delay: -7s; }
        .blob-3 { top: 40%; left: 40%; width: 40vw; height: 40vw; background: #4c1d95; opacity: 0.2; animation-delay: -14s; }
        
        .delete-art-btn { z-index: 10; }
        .gallery-item:hover .delete-art-btn {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative overflow-x-hidden z-0">

    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <nav class="sticky top-0 z-40 glass-panel border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex-shrink-0 flex items-center space-x-3">
                    <img src="https://cdn.discordapp.com/attachments/1380106400226873345/1555159066035232828/MysteGUI_246.png?backend=b2&ex=6abf823e&is=6abe30be&hm=8e3aaf5520e878005e9d9e920451df79c6443e6d3dd601574c5c4b90c83910ca&" alt="MysteGUI Logo" class="h-8 w-8 rounded-full border border-indigo-500/50 object-cover shadow-sm">
                    <span class="font-bold text-2xl tracking-tighter text-white">
                        <span class="text-indigo-500">MYSTE</span>GUI.
                    </span>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-8">
                        <button data-tab="portfolio" class="nav-tab px-3 py-2 rounded-md text-sm font-medium text-white bg-gray-800 transition-colors">Portfolio</button>
                        <button data-tab="commissions" class="nav-tab px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:text-white hover:bg-gray-700 transition-colors">Commissions</button>
                        <button data-tab="socials" class="nav-tab px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:text-white hover:bg-gray-700 transition-colors">Socials</button>
                    </div>
                </div>
                <div class="-mr-2 flex md:hidden">
                    <button type="button" id="mobile-menu-btn" class="inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-white hover:bg-gray-700 focus:outline-none">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
        <div class="md:hidden hidden bg-gray-900 border-b border-gray-800" id="mobile-menu">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                <button data-tab="portfolio" class="nav-tab mobile block px-3 py-2 rounded-md text-base font-medium text-white bg-gray-800 w-full text-left">Portfolio</button>
                <button data-tab="commissions" class="nav-tab mobile block px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:text-white hover:bg-gray-700 w-full text-left">Commissions</button>
                <button data-tab="socials" class="nav-tab mobile block px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:text-white hover:bg-gray-700 w-full text-left">Socials</button>
            </div>
        </div>
    </nav>

    <main id="main-content" class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Content gets injected here -->
    </main>

    <!-- Upload Modal -->
    <div id="upload-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black bg-opacity-75 p-4">
        <div class="glass-panel w-full max-w-md rounded-xl p-6 modal-enter relative shadow-2xl shadow-indigo-900/20">
            <button id="close-modal-btn" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                <i class="fas fa-times text-xl"></i>
            </button>
            <h3 class="text-xl font-bold mb-4 text-white">Add New Artwork</h3>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-400 mb-1">Title</label>
                <input type="text" id="upload-title" class="w-full bg-gray-800 border border-gray-700 rounded-md py-2 px-3 text-white focus:outline-none focus:border-indigo-500" placeholder="e.g., Cyberpunk Samurai">
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-400 mb-1">Direct Image URL</label>
                <input type="url" id="upload-url" class="w-full bg-gray-800 border border-gray-700 rounded-md py-2 px-3 text-white focus:outline-none focus:border-indigo-500" placeholder="e.g., https://cdn.discordapp.com/...">
                <p class="text-xs text-gray-500 mt-2"><i class="fas fa-info-circle"></i> Paste a direct link to your image (Discord, Imgur, etc.)</p>
            </div>

            <button id="submit-upload-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-md transition-colors flex justify-center items-center mt-6">
                <span>Add to Portfolio</span>
                <i id="upload-spinner" class="fas fa-spinner fa-spin ml-2 hidden"></i>
            </button>
        </div>
    </div>

    <!-- Admin Login Modal (Secret) -->
    <div id="login-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black bg-opacity-75 p-4">
        <div class="glass-panel w-full max-w-sm rounded-xl p-6 modal-enter relative shadow-2xl shadow-indigo-900/20">
            <button id="close-login-btn" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                <i class="fas fa-times text-xl"></i>
            </button>
            <h3 class="text-xl font-bold mb-4 text-white">Artist Login</h3>
            <p class="text-xs text-gray-400 mb-4">Log in to manage your portfolio.</p>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-400 mb-1">Email</label>
                <input type="email" id="login-email" class="w-full bg-gray-800 border border-gray-700 rounded-md py-2 px-3 text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-400 mb-1">Password</label>
                <input type="password" id="login-password" class="w-full bg-gray-800 border border-gray-700 rounded-md py-2 px-3 text-white focus:outline-none focus:border-indigo-500">
            </div>
            <button id="submit-login-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-md transition-colors">
                Log In
            </button>
            <p id="login-error" class="text-red-400 text-xs mt-3 hidden"></p>
        </div>
    </div>

    <!-- Custom Alert Modal -->
    <div id="alert-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black bg-opacity-75 p-4">
        <div class="glass-panel w-full max-w-sm rounded-xl p-6 modal-enter text-center">
            <div id="alert-icon" class="text-4xl mb-4 text-indigo-500"><i class="fas fa-info-circle"></i></div>
            <h3 id="alert-title" class="text-xl font-bold mb-2 text-white">Notice</h3>
            <p id="alert-message" class="text-gray-300 mb-6">Message goes here.</p>
            <button id="close-alert-btn" class="bg-gray-700 hover:bg-gray-600 text-white py-2 px-6 rounded-md transition-colors">OK</button>
        </div>
    </div>

    <!-- Confirm Delete Modal -->
    <div id="confirm-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black bg-opacity-75 p-4">
        <div class="glass-panel w-full max-w-sm rounded-xl p-6 modal-enter text-center shadow-2xl shadow-red-900/20">
            <div class="text-4xl mb-4 text-red-500"><i class="fas fa-exclamation-triangle"></i></div>
            <h3 class="text-xl font-bold mb-2 text-white">Delete Artwork?</h3>
            <p class="text-gray-300 mb-6">Are you sure you want to remove this image? This cannot be undone.</p>
            <div class="flex justify-center space-x-4">
                <button id="cancel-delete-btn" class="bg-gray-700 hover:bg-gray-600 text-white py-2 px-4 rounded-md transition-colors w-full">Cancel</button>
                <button id="confirm-delete-btn" class="bg-red-600 hover:bg-red-700 text-white py-2 px-4 rounded-md transition-colors w-full flex justify-center items-center">
                    <span>Delete</span>
                    <i id="delete-spinner" class="fas fa-spinner fa-spin ml-2 hidden"></i>
                </button>
            </div>
        </div>
    </div>

    <footer class="border-t border-gray-800 mt-auto py-6 text-center text-gray-500 text-sm relative z-10">
        <!-- Double click the copyright text to open the hidden login menu! -->
        <p id="secret-login-trigger" class="cursor-pointer select-none hover:text-gray-400 transition-colors">&copy; 2026 MysteGUI Commissions.</p>
        <button id="logout-btn" class="hidden mt-2 text-indigo-400 hover:text-indigo-300 underline mx-auto block">Log Out</button>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, deleteDoc, doc, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // REPLACE THIS BLOCK WITH YOUR REAL CONFIG
        // ==========================================
        const firebaseConfig = {
  		apiKey: "AIzaSyDMLKZgES04mUlJ1ygbPUUl1mTz5U-1wtE",
  		authDomain: "mystegui-portfolio-ec024.firebaseapp.com",
  		projectId: "mystegui-portfolio-ec024",
  		storageBucket: "mystegui-portfolio-ec024.firebasestorage.app",
  		messagingSenderId: "226274273666",
  		appId: "1:226274273666:web:1cba5871a850830b9f479b"
	};
        // ==========================================

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let isAdmin = false;
        let artworksData = []; 

        const state = {
            currentTab: 'portfolio',
            sortOrder: 'newest',
            calculator: { currency: 'usd', render: 'rendered', shot: 'bust', addons: [], commercial: false }
        };

        const prices = {
            usd: {
                render: { lineart: { bust: 15, half: 25, thigh: 35, full: 50 }, greyscale: { bust: 25, half: 35, thigh: 45, full: 65 }, rendered: { bust: 35, half: 50, thigh: 65, full: 90 } },
                addons: { extra: 15, simpleBg: 10, complexBg: 20, rush: 15 }
            },
            php: {
                render: { lineart: { bust: 50, half: 80, thigh: 100, full: 130 }, greyscale: { bust: 70, half: 100, thigh: 120, full: 160 }, rendered: { bust: 100, half: 150, thigh: 160, full: 200 } },
                addons: { extra: 80, simpleBg: 50, complexBg: 100, rush: 75 }
            }
        };

        // DOM Elements
        const mainContent = document.getElementById('main-content');
        const navTabs = document.querySelectorAll('.nav-tab');
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const uploadModal = document.getElementById('upload-modal');
        const alertModal = document.getElementById('alert-modal');
        const confirmModal = document.getElementById('confirm-modal');
        const loginModal = document.getElementById('login-modal');
        let itemToDelete = null;

        // Modals & Alerts
        function showAlert(title, message, isError = false) {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            const icon = document.getElementById('alert-icon');
            icon.innerHTML = isError ? '<i class="fas fa-exclamation-triangle"></i>' : '<i class="fas fa-info-circle"></i>';
            icon.className = `text-4xl mb-4 ${isError ? 'text-red-500' : 'text-indigo-500'}`;
            alertModal.classList.remove('hidden');
            alertModal.classList.add('flex');
        }
        document.getElementById('close-alert-btn').addEventListener('click', () => {
            alertModal.classList.add('hidden');
            alertModal.classList.remove('flex');
        });

        // Secret Login Logic
        document.getElementById('secret-login-trigger').addEventListener('dblclick', () => {
            if (!isAdmin) {
                loginModal.classList.remove('hidden');
                loginModal.classList.add('flex');
            }
        });
        document.getElementById('close-login-btn').addEventListener('click', () => {
            loginModal.classList.add('hidden');
            loginModal.classList.remove('flex');
        });
        document.getElementById('submit-login-btn').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            const errDisplay = document.getElementById('login-error');
            
            try {
                if (firebaseConfig.apiKey === "PASTE_YOUR_API_KEY_HERE") {
                    throw new Error("mock");
                }
                await signInWithEmailAndPassword(auth, email, pass);
                loginModal.classList.add('hidden');
                loginModal.classList.remove('flex');
                errDisplay.classList.add('hidden');
                showAlert("Logged In", "Welcome back, MysteGUI. You can now manage your portfolio.");
            } catch (error) {
                if (error.message === "mock") {
                    showAlert("Setup Required", "You must link your Firebase Database first! See the setup guide.", true);
                    loginModal.classList.add('hidden');
                    loginModal.classList.remove('flex');
                } else {
                    errDisplay.innerText = "Invalid credentials.";
                    errDisplay.classList.remove('hidden');
                }
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await signOut(auth);
            showAlert("Logged Out", "You have been logged out securely.");
        });

        // Authentication State Observer
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                isAdmin = true;
                document.getElementById('logout-btn').classList.remove('hidden');
            } else {
                currentUser = null;
                isAdmin = false;
                document.getElementById('logout-btn').classList.add('hidden');
            }
            if(state.currentTab === 'portfolio') renderApp();
        });

        // Delete Logic
        document.getElementById('cancel-delete-btn').addEventListener('click', () => {
            confirmModal.classList.add('hidden');
            confirmModal.classList.remove('flex');
            itemToDelete = null;
        });

        document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
            if (!itemToDelete) return;
            const btn = document.getElementById('confirm-delete-btn');
            const spinner = document.getElementById('delete-spinner');
            btn.disabled = true;
            spinner.classList.remove('hidden');

            try {
                if (firebaseConfig.apiKey !== "PASTE_YOUR_API_KEY_HERE") {
                    await deleteDoc(doc(db, 'artworks', itemToDelete));
                } else {
                    artworksData = artworksData.filter(a => a.id !== itemToDelete);
                }
                confirmModal.classList.add('hidden');
                confirmModal.classList.remove('flex');
                if(state.currentTab === 'portfolio') renderApp();
                showAlert("Deleted", "Artwork has been removed from the gallery.");
            } catch (e) {
                console.error("Delete error", e);
                showAlert("Error", "Failed to delete artwork.", true);
            } finally {
                btn.disabled = false;
                spinner.classList.add('hidden');
                itemToDelete = null;
            }
        });

        // Listen for Real Database Updates
        function listenToArtworks() {
            if (firebaseConfig.apiKey === "PASTE_YOUR_API_KEY_HERE") {
                return; // Do nothing in mock mode to prevent console errors
            }

            const artworksRef = collection(db, 'artworks');
            // We fetch them essentially unordered here or ordered by default, because we handle sorting in JavaScript now!
            const q = query(artworksRef, orderBy("timestamp", "desc"));
            
            onSnapshot(q, (snapshot) => {
                const fetched = [];
                snapshot.forEach((doc) => {
                    fetched.push({ id: doc.id, ...doc.data() });
                });
                artworksData = fetched;
                if (state.currentTab === 'portfolio') renderApp();
            }, (error) => {
                console.error("Firestore read error.", error);
            });
        }

        async function handleUpload() {
            if (!isAdmin && firebaseConfig.apiKey !== "PASTE_YOUR_API_KEY_HERE") {
                showAlert("Unauthorized", "Only the owner can upload artworks.", true);
                return;
            }

            const titleInput = document.getElementById('upload-title');
            const urlInput = document.getElementById('upload-url');
            const title = titleInput.value.trim() || 'Untitled Artwork';
            const imageUrl = urlInput.value.trim();
            
            if (!imageUrl) {
                showAlert("Missing URL", "Please paste a direct link to your image.", true);
                return;
            }

            const btn = document.getElementById('submit-upload-btn');
            const spinner = document.getElementById('upload-spinner');
            btn.disabled = true;
            spinner.classList.remove('hidden');

            try {
                // Verify the URL is a real image before saving
                const img = new Image();
                img.onload = async () => {
                    const orientation = img.width > img.height ? 'landscape' : 'portrait';
                    
                    if (firebaseConfig.apiKey !== "PASTE_YOUR_API_KEY_HERE") {
                        const artworksRef = collection(db, 'artworks');
                        await addDoc(artworksRef, {
                            title: title,
                            url: imageUrl,
                            orientation: orientation,
                            timestamp: Date.now()
                        });
                    } else {
                        // Mock upload for local preview
                        artworksData.unshift({ id: Date.now().toString(), title, url: imageUrl, orientation, timestamp: Date.now() });
                        if(state.currentTab === 'portfolio') renderApp();
                    }
                    
                    closeUploadModal();
                    showAlert("Success!", "Artwork published to your portfolio.");
                    btn.disabled = false;
                    spinner.classList.add('hidden');
                    titleInput.value = '';
                    urlInput.value = '';
                };
                
                img.onerror = () => {
                    showAlert("Invalid Image", "Could not load the image. Make sure it is a direct image link.", true);
                    btn.disabled = false;
                    spinner.classList.add('hidden');
                };
                
                img.src = imageUrl;
                
            } catch (error) {
                console.error("Upload error:", error);
                showAlert("Upload Failed", "Error saving to database.", true);
                btn.disabled = false;
                spinner.classList.add('hidden');
            }
        }

        function getPortfolioHTML() {
            let gridItems = '';
            const showControls = isAdmin || firebaseConfig.apiKey === "PASTE_YOUR_API_KEY_HERE";
            
            // SORTING LOGIC
            let sortedArtworks = [...artworksData];
            if (state.sortOrder === 'oldest') {
                sortedArtworks.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            } else {
                sortedArtworks.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            }
            
            if (sortedArtworks.length === 0) {
                gridItems = `
                    <div class="py-16 text-center text-gray-400 w-full flex flex-col items-center justify-center">
                        <i class="fas fa-images text-6xl mb-4 opacity-40"></i>
                        <p class="text-xl font-medium text-gray-300">Your portfolio is currently empty.</p>
                        ${showControls ? '<p class="text-sm mt-3 text-indigo-400 bg-indigo-900/30 px-4 py-2 rounded-lg border border-indigo-500/30">Click the "Add Art" button above to add your first piece!</p>' : ''}
                    </div>
                `;
            } else {
                gridItems = sortedArtworks.map(art => `
                    <div class="gallery-item bg-gray-800 rounded-xl border border-gray-700 relative group">
                        <img src="${art.url}" alt="${art.title}" loading="lazy">
                        <div class="gallery-overlay">
                            <h4 class="text-white font-bold text-lg">${art.title}</h4>
                        </div>
                        ${showControls ? `<button data-id="${art.id}" class="delete-art-btn absolute top-3 right-3 bg-red-600/90 hover:bg-red-500 text-white w-9 h-9 rounded-full flex items-center justify-center opacity-0 transition-all duration-300 transform -translate-y-2 shadow-lg hover:scale-110"><i class="fas fa-trash-alt text-sm pointer-events-none"></i></button>` : ''}
                    </div>
                `).join('');
            }

            const desktopUploadBtn = showControls ? `
                <button id="open-upload-btn" class="hidden md:flex items-center space-x-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg transition-colors shadow-lg shadow-indigo-900/50">
                    <i class="fas fa-plus"></i> <span>Add Art</span>
                </button>
            ` : '';
            const mobileUploadBtn = showControls ? `
                <button id="open-upload-btn-mobile" class="md:hidden w-full flex items-center justify-center space-x-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-3 rounded-lg mb-8 transition-colors shadow-lg">
                    <i class="fas fa-plus"></i> <span>Add New Artwork</span>
                </button>
            ` : '';

            return `
                <div class="flex justify-between items-end mb-8 flex-wrap gap-4">
                    <div>
                        <h1 class="text-4xl font-extrabold text-white mb-2">Featured Works</h1>
                        <p class="text-gray-400 max-w-2xl">A collection of dynamic character concepts, world-building illustrations, and polished artworks.</p>
                    </div>
                    <div class="flex items-center space-x-3 w-full md:w-auto">

        }

                                <div class="flex flex-wrap gap-4 mb-4">
                                    <div class="bg-gray-800/80 px-4 py-2 rounded-lg border border-gray-700 flex-1 min-w-[150px]">

                                    <div class="bg-gray-800/80 px-4 py-2 rounded-lg border border-gray-700 flex-1 min-w-[150px]">

                                        <span class="font-semibold text-white">PayPal</span>
                                    </div>
                                </div>
                                <p class="text-sm text-gray-400"><i class="fas fa-exclamation-circle text-indigo-400 mr-1"></i> Payment details will be sent after your commission is accepted. Do not send payment before receiving confirmation.</p>

                        </div>

                        <div class="lg:col-span-5 glass-panel rounded-xl p-6 relative overflow-hidden h-fit lg:sticky lg:top-24">

                            <div class="flex justify-between items-center mb-6">
                                <h2 class="text-2xl font-bold text-white flex items-center">

                                <div class="flex bg-gray-800 rounded-lg p-1 border border-gray-700">
                                    <button class="curr-toggle px-3 py-1 text-sm rounded-md font-medium transition-colors ${curr === 'usd' ? 'bg-indigo-600 text-white' : 'text-gray-400 hover:text-white'}" data-curr="usd">USD $</button>
                                    <button class="curr-toggle px-3 py-1 text-sm rounded-md font-medium transition-colors ${curr === 'php' ? 'bg-indigo-600 text-white' : 'text-gray-400 hover:text-white'}" data-curr="php">PHP ₱</button>
                                </div>
                            </div>
                            
                            <div class="mb-5">
                                <label class="block text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wider">1. Render Type</label>
                                <div class="grid grid-cols-3 gap-2">

                                <label class="block text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wider">2. Shot Type</label>
                                <div class="grid grid-cols-2 gap-2">
                                    ${createRadioStr('shot', 'bust', 'Bust Up')}
                                    ${createRadioStr('shot', 'half', 'Half-Body')}
                                    ${createRadioStr('shot', 'thigh', 'Thigh-up')}
                                    ${createRadioStr('shot', 'full', 'Full-Body')}
                                </div>
                            </div>
                            
                            <div class="mb-6">
                                <label class="block text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wider">3. Add-ons & Usage</label>
                                <div class="space-y-2">
                                    ${createCheckboxStr('extra', 'Extra Character', addPrices.extra, sym)}
                                    ${createCheckboxStr('simpleBg', 'Simple Background', addPrices.simpleBg, sym)}
                                    ${createCheckboxStr('complexBg', 'Complex Background', addPrices.complexBg, sym)}
                                    ${createCheckboxStr('rush', 'Rush Order (48hr)', addPrices.rush, sym)}
                                    
                                    <label class="flex items-center cursor-pointer group mt-4 pt-3 border-t border-gray-700">
                                        <div class="relative flex items-center justify-center">
                                            <input type="checkbox" id="calc-commercial" class="peer sr-only" ${state.calculator.commercial ? 'checked' : ''}>
                                            <div class="w-5 h-5 bg-gray-800 border border-gray-600 rounded peer-checked:bg-indigo-500 peer-checked:border-indigo-500 transition-colors"></div>
                                            <i class="fas fa-check absolute text-white text-xs opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity"></i>
                                        </div>
                                        <div class="ml-3 text-gray-300 group-hover:text-white transition-colors flex-grow flex justify-between items-center">
                                            <span class="font-semibold text-indigo-300">Commercial Use</span>
                                            <span class="text-xs bg-indigo-900/50 text-indigo-300 px-2 py-1 rounded">2× Base Price</span>
                                        </div>
                                    </label>
                                </div>
                            </div>
                            
                            <div class="border-t border-gray-700 pt-5 mt-2 flex justify-between items-center bg-gray-900/50 -mx-6 -mb-6 p-6 rounded-b-xl">
                                <div>
                                    <span class="block text-gray-400 font-medium">Estimated Total</span>
                                    <span class="text-xs text-gray-500">*Major revisions (+${sym}${curr==='usd'?'10':'20'}) not included</span>
                                </div>
                                <div class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400" id="calc-total">
                                    ${sym}0
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function getSocialsHTML() {
            const socials = [
                { name: "YouTube", icon: "fab fa-youtube", color: "hover:bg-red-600 hover:border-red-600", url: "https://www.youtube.com/@MysteGUIofficial323", text: "@MysteGUIofficial323" },
                { name: "Twitter / X", icon: "fab fa-twitter", color: "hover:bg-blue-400 hover:border-blue-400", url: "https://x.com/MysteGUICasual", text: "@MysteGUICasual" },
                { name: "Instagram", icon: "fab fa-instagram", color: "hover:bg-pink-600 hover:border-pink-600", url: "https://www.instagram.com/mystegui_official/?hl=en", text: "@mystegui_official" },
                { name: "Facebook", icon: "fab fa-facebook", color: "hover:bg-blue-600 hover:border-blue-600", url: "https://www.facebook.com/profile.php?id=61577494834616&sk=about", text: "MysteGUI" },
                { name: "Discord Server", icon: "fab fa-discord", color: "hover:bg-indigo-500 hover:border-indigo-500", url: "https://discord.gg/79hgWqGukp", text: "Join the Community" },
                { name: "Email", icon: "fas fa-envelope", color: "hover:bg-gray-500 hover:border-gray-500", url: "mailto:MysteGUIOfficial@gmail.com", text: "MysteGUIOfficial@gmail.com" }
            ];

            return `
                <div class="max-w-4xl mx-auto text-center py-8">
                    <h1 class="text-4xl font-extrabold text-white mb-4">Connect With Me</h1>
                    <p class="text-gray-400 mb-10">Follow me on social media, join the Discord, or reach out via email for business inquiries!</p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        ${socials.map(s => `
                            <a href="${s.url}" target="_blank" rel="noopener noreferrer" class="glass-panel border border-transparent p-5 rounded-xl flex items-center space-x-4 text-gray-300 transition-all duration-300 hover:text-white ${s.color} hover:shadow-lg transform hover:-translate-y-1 group">
                                <div class="w-12 h-12 flex items-center justify-center bg-gray-800 rounded-full text-2xl group-hover:bg-white/20 transition-colors">
                                    <i class="${s.icon}"></i>
                                </div>
                                <div class="text-left overflow-hidden">
                                    <span class="block font-bold text-lg truncate">${s.name}</span>
                                    <span class="block text-sm opacity-80 truncate">${s.text}</span>

                            </a>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function createRadioStr(group, value, label) {
            const isChecked = state.calculator[group] === value;
            return `
                <label class="cursor-pointer">
                    <input type="radio" name="${group}" value="${value}" class="peer sr-only calc-input" ${isChecked ? 'checked' : ''}>
                    <div class="text-center px-2 py-3 rounded-md bg-gray-800 border border-gray-700 text-sm text-gray-400 transition-all peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-500 peer-hover:border-gray-500 shadow-sm font-medium">
                        ${label}
                    </div>
                </label>
            `;
        }

        function createCheckboxStr(id, label, price, sym) {
            const isChecked = state.calculator.addons.includes(id);
            return `
                <label class="flex items-center cursor-pointer group py-1">
                    <div class="relative flex items-center justify-center">
                        <input type="checkbox" name="addon" value="${id}" class="peer sr-only calc-input" ${isChecked ? 'checked' : ''}>
                        <div class="w-5 h-5 bg-gray-800 border border-gray-600 rounded peer-checked:bg-indigo-500 peer-checked:border-indigo-500 transition-colors"></div>
                        <i class="fas fa-check absolute text-white text-xs opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity"></i>
                    </div>
                    <div class="ml-3 text-gray-300 group-hover:text-white transition-colors flex-grow flex justify-between items-center">
                        <span>${label}</span>
                        <span class="text-indigo-400 text-sm">+${sym}${price}</span>
                    </div>
                </label>
            `;
        }

        function calculateTotal() {
            const curr = state.calculator.currency;
            let basePrice = prices[curr].render[state.calculator.render][state.calculator.shot];
            if (state.calculator.commercial) basePrice *= 2;
            let addonTotal = 0;
            state.calculator.addons.forEach(addonId => { addonTotal += prices[curr].addons[addonId]; });
            
            const totalEl = document.getElementById('calc-total');
            if (totalEl) {
                totalEl.innerText = `${curr === 'usd' ? '$' : '₱'}${basePrice + addonTotal}`;
                totalEl.style.transform = 'scale(1.1)';
                setTimeout(() => totalEl.style.transform = 'scale(1)', 150);
            }
        }

        function bindCalculatorEvents() {
            document.querySelectorAll('.curr-toggle').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    state.calculator.currency = e.target.dataset.curr;
                    renderApp();
                });
            });
            document.querySelectorAll('.calc-input').forEach(input => {
                input.addEventListener('change', (e) => {
                    if (e.target.name === 'render') state.calculator.render = e.target.value;
                    if (e.target.name === 'shot') state.calculator.shot = e.target.value;
                    if (e.target.name === 'addon') {
                        if (e.target.checked && !state.calculator.addons.includes(e.target.value)) {
                            state.calculator.addons.push(e.target.value);
                        } else if (!e.target.checked) {
                            state.calculator.addons = state.calculator.addons.filter(a => a !== e.target.value);
                        }
                    }
                    calculateTotal();
                });
            });
            const commToggle = document.getElementById('calc-commercial');
            if(commToggle) commToggle.addEventListener('change', (e) => {
                state.calculator.commercial = e.target.checked;
                calculateTotal();
            });
            calculateTotal();
        }

        function bindPortfolioEvents() {
            document.querySelectorAll('.delete-art-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    itemToDelete = e.currentTarget.dataset.id;
                    confirmModal.classList.remove('hidden');
                    confirmModal.classList.add('flex');
                });
            });

            const sortSelect = document.getElementById('sort-select');
            if (sortSelect) {
                sortSelect.addEventListener('change', (e) => {
                    state.sortOrder = e.target.value;
                    renderApp();
                });
            }
        }

        function renderApp() {
            navTabs.forEach(tab => {
                if (tab.dataset.tab === state.currentTab) {
                    tab.classList.remove('text-gray-300', 'hover:bg-gray-700');
                    tab.classList.add('text-white', 'bg-gray-800');
                } else {
                    tab.classList.remove('text-white', 'bg-gray-800');
                    tab.classList.add('text-gray-300', 'hover:bg-gray-700');
                }
            });

            if (state.currentTab === 'portfolio') {
                mainContent.innerHTML = getPortfolioHTML();
                const btn1 = document.getElementById('open-upload-btn');
                const btn2 = document.getElementById('open-upload-btn-mobile');
                if (btn1) btn1.addEventListener('click', openUploadModal);
                if (btn2) btn2.addEventListener('click', openUploadModal);
                bindPortfolioEvents();
            } else if (state.currentTab === 'commissions') {
                mainContent.innerHTML = getCommissionsHTML();
                bindCalculatorEvents();
            } else if (state.currentTab === 'socials') {
                mainContent.innerHTML = getSocialsHTML();
            }
        }

        navTabs.forEach(tab => {
            tab.addEventListener('click', (e) => {
                state.currentTab = e.target.dataset.tab;
                renderApp();
                mobileMenu.classList.add('hidden');
            });
        });
        mobileMenuBtn.addEventListener('click', () => { mobileMenu.classList.toggle('hidden'); });

        function openUploadModal() {
            uploadModal.classList.remove('hidden');
            uploadModal.classList.add('flex');
        }
        function closeUploadModal() {
            uploadModal.classList.add('hidden');
            uploadModal.classList.remove('flex');
        }
        document.getElementById('close-modal-btn').addEventListener('click', closeUploadModal);
        document.getElementById('submit-upload-btn').addEventListener('click', handleUpload);

        renderApp();
        listenToArtworks();

    </script>
</body>
</html>
