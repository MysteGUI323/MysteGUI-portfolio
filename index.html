<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MysteGUI | Art Portfolio & Commissions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@300;400;600;800&family=Russo+One&display=swap');
        
        /* 1. Consolidated Body & Theming Rules */
        :root { --ink: #070811; --panel: rgba(20, 23, 39, 0.72); --line: rgba(187, 198, 255, 0.14); --violet: #8b5cf6; --glow: #c4b5fd; }
        
        body {
            font-family: 'Chakra Petch', 'Inter', sans-serif;
            background-color: #090b15;
            color: #e2e8f0;
            letter-spacing: 0.01em;
            background-image:
                radial-gradient(circle at 13% 20%, rgba(96, 53, 213, 0.48), transparent 30rem),
                radial-gradient(circle at 77% 72%, rgba(91, 47, 205, 0.34), transparent 27rem),
                linear-gradient(120deg, #111b3d 0%, #0a0d19 43%, #0a0b14 100%);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 4rem 0 0;
            z-index: -1;
            pointer-events: none;
            opacity: 0.42;
            background-image: radial-gradient(rgba(190, 175, 255, 0.32) 1.15px, transparent 1.5px);
            background-size: 18px 18px;
            -webkit-mask-image: radial-gradient(ellipse 76% 80% at 34% 40%, #000 0%, rgba(0, 0, 0, 0.78) 43%, transparent 82%);
            mask-image: radial-gradient(ellipse 76% 80% at 34% 40%, #000 0%, rgba(0, 0, 0, 0.78) 43%, transparent 82%);
        }

        /* 2. Base Components & Glassmorphism */
        .glass-panel {
            background: rgba(22, 27, 49, 0.78);
            border: 2px solid rgba(122, 108, 218, 0.32);
            border-radius: 0.85rem;
            box-shadow: 5px 5px 0 rgba(6, 8, 18, 0.45), inset 0 1px rgba(255, 255, 255, 0.055);
            backdrop-filter: blur(18px) saturate(125%); 
            -webkit-backdrop-filter: blur(18px) saturate(125%);
        }

        /* 3. Navbar Fixes */
        nav.glass-panel {
            overflow: visible;
            background: #182234;
            border-bottom: 3px solid rgba(118, 92, 255, 0.46);
            box-shadow: 0 5px 0 rgba(5, 6, 15, 0.32);
            border-radius: 0;
        }
        
        h1, h2, h3, nav .tracking-tighter {
            font-family: 'Russo One', 'Chakra Petch', sans-serif;
            letter-spacing: 0.015em;
        }
        
        nav .flex-shrink-0 { position: relative; z-index: 2; }
        
        /* Adjusted Logo & Typography to prevent layout breakage */
        nav img {
            width: 3.5rem !important;
            height: 3.5rem !important;
            border: 2px solid #0ea5ff !important;
            box-shadow: 0 0 0 3px #11192c, 0 0 0 5px #136ee6, 0 10px 22px rgba(0, 0, 0, 0.52) !important;
        }
        
        nav .tracking-tighter {
            font-size: 1.85rem !important;
            text-shadow: 3px 3px 0 rgba(31, 26, 75, 0.85);
        }
        nav .tracking-tighter .text-indigo-500 { color: #7774ff !important; }

        .nav-tab {
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 600;
            font-size: 1.04rem;
            letter-spacing: 0.035em;
            border-radius: 0.65rem;
            border: 1px solid transparent; 
            transition: all 180ms ease;
        }
        
        .nav-tab.bg-gray-800 {
            background: #222c3d;
            border-color: rgba(255, 255, 255, 0.025);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.025);
        }
        
        .nav-tab:hover, .nav-tab.bg-gray-800:hover { 
            background: #333f58; 
            box-shadow: 3px 3px 0 rgba(6, 8, 18, 0.45); 
            transform: translateY(-1px);
        }

        /* 4. Masonry Layout & Gallery Items */
        main { padding-top: clamp(3rem, 5vw, 4.5rem) !important; padding-bottom: clamp(3rem, 7vw, 5rem) !important; }
        h1 { text-wrap: balance; }
        
        .gallery-grid {
            column-count: 1;
            column-gap: 1.25rem;
        }
        @media (min-width: 640px) { .gallery-grid { column-count: 2; } }
        @media (min-width: 1024px) { .gallery-grid { column-count: 3; } }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(135, 118, 255, 0.42);
            border-radius: 0.85rem;
            background: #121526; 
            box-shadow: 5px 5px 0 rgba(4, 6, 15, 0.52);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            cursor: pointer;
            break-inside: avoid;
            margin-bottom: 1.5rem;
            display: inline-block;
            width: 100%;
        }

        .gallery-item:hover { 
            transform: translate(-2px, -6px) rotate(-0.35deg); 
            box-shadow: 8px 9px 0 rgba(6, 7, 18, 0.62); 
            border-color: rgba(196, 181, 253, 0.6);
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.5s ease;
        }
        .gallery-item:hover img { transform: scale(1.05); }

        .gallery-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 3.5rem 1.25rem 1.2rem; 
            background: linear-gradient(to top, rgba(6, 7, 15, 0.97), rgba(6, 7, 15, 0.54) 48%, transparent);
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        .gallery-item:hover .gallery-overlay { transform: translateY(0); }

        .delete-art-btn { z-index: 10; }
        .gallery-item:hover .delete-art-btn { opacity: 1; transform: translateY(0); }

        /* 5. Inputs, Buttons & UI Details */
        button, a { -webkit-tap-highlight-color: transparent; }
        button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }
        
        input, select, textarea { transition: border-color 180ms ease, box-shadow 180ms ease, background 180ms ease; }
        input:focus, select:focus, textarea:focus { border-color: var(--violet) !important; box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.16); }
        
        button.bg-indigo-600, .bg-indigo-600 {
            background: linear-gradient(135deg, #6754f4, #4635dc) !important;
            box-shadow: 3px 4px 0 rgba(16, 12, 54, 0.82);
        }

        /* 6. Ambient Blobs & Modals */
        @keyframes float {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .bg-blob {
            position: fixed; filter: blur(90px); opacity: 0.4;
            animation: float 20s infinite ease-in-out alternate; z-index: -1;
            border-radius: 50%; pointer-events: none;
        }
        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #3730a3; }
        .blob-2 { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: #1e1b4b; animation-delay: -7s; }
        .blob-3 { top: 40%; left: 40%; width: 40vw; height: 40vw; background: #4c1d95; opacity: 0.2; animation-delay: -14s; }
        
        .modal-enter { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f1115; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        ::selection { background: rgba(139, 92, 246, 0.58); color: white; }

        footer { border-color: rgba(196, 181, 253, 0.1) !important; background: linear-gradient(to top, rgba(7, 8, 17, 0.55), transparent); }

        @media (max-width: 767px) {
            nav img { width: 3rem !important; height: 3rem !important; }
            nav .tracking-tighter { font-size: 1.45rem !important; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; } }
    </style>
</head>
<body class="min-h-screen flex flex-col relative overflow-x-hidden z-0">

    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <nav class="sticky top-0 z-40 glass-panel">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex-shrink-0 flex items-center space-x-3">
                    <img src="https://i.imgur.com/GC8deTU.png" alt="MysteGUI Logo" class="rounded-full object-cover">
                    <span class="font-bold tracking-tighter text-white">
                        <span class="text-indigo-500">MYSTE</span>GUI.
                    </span>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-8">
                        <button data-tab="portfolio" class="nav-tab px-3 py-2 text-white bg-gray-800">Portfolio</button>
                        <button data-tab="commissions" class="nav-tab px-3 py-2 text-gray-300 hover:text-white hover:bg-gray-700">Commissions</button>
                        <button data-tab="socials" class="nav-tab px-3 py-2 text-gray-300 hover:text-white hover:bg-gray-700">Socials</button>
                    </div>
                </div>
                <div class="-mr-2 flex md:hidden">
                    <button type="button" id="mobile-menu-btn" class="inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-white hover:bg-gray-700 focus:outline-none">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
        <div class="md:hidden hidden bg-gray-900 border-b border-gray-800" id="mobile-menu">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                <button data-tab="portfolio" class="nav-tab mobile block px-3 py-2 text-white bg-gray-800 w-full text-left">Portfolio</button>
                <button data-tab="commissions" class="nav-tab mobile block px-3 py-2 text-gray-300 hover:text-white hover:bg-gray-700 w-full text-left">Commissions</button>
                <button data-tab="socials" class="nav-tab mobile block px-3 py-2 text-gray-300 hover:text-white hover:bg-gray-700 w-full text-left">Socials</button>
            </div>
        </div>
    </nav>

    <main id="main-content" class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Content gets injected here -->
    </main>

    <!-- Upload Modal -->
    <div id="upload-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black bg-opacity-75 p-4">
        <div class="glass-panel w-full max-w-md rounded-xl p-6 modal-enter relative shadow-2xl shadow-indigo-900/20">
            <button id="close-modal-btn" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                <i class="fas fa-times text-xl"></i>
            </button>
            <h3 class="text-xl font-bold mb-4 text-white">Add New Artwork</h3>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-400 mb-1">Title</label>
                <input type="text" id="upload-title" class="w-full bg-gray-800 border border-gray-700 rounded-md py-2 px-3 text-white focus:outline-none focus:border-indigo-500" placeholder="e.g., Cyberpunk Samurai">
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-400 mb-1">Direct Image URL</label>
                <input type="url" id="upload-url" class="w-full bg-gray-800 border border-gray-700 rounded-md py-2 px-3 text-white focus:outline-none focus:border-indigo-500" placeholder="e.g., https://...">
                <p class="text-xs text-gray-500 mt-2"><i class="fas fa-info-circle"></i> Paste a direct link to your image (Discord, Imgur, etc.)</p>
            </div>

            <button id="submit-upload-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-md transition-colors flex justify-center items-center mt-6">
                <span>Add to Portfolio</span>
                <i id="upload-spinner" class="fas fa-spinner fa-spin ml-2 hidden"></i>
            </button>
        </div>
    </div>

    <!-- Admin Login Modal (Secret) -->
    <div id="login-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black bg-opacity-75 p-4">
        <div class="glass-panel w-full max-w-sm rounded-xl p-6 modal-enter relative shadow-2xl shadow-indigo-900/20">
            <button id="close-login-btn" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                <i class="fas fa-times text-xl"></i>
            </button>
            <h3 class="text-xl font-bold mb-4 text-white">Artist Login</h3>
            <p class="text-xs text-gray-400 mb-4">Log in to manage your portfolio.</p>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-400 mb-1">Email</label>
                <input type="email" id="login-email" class="w-full bg-gray-800 border border-gray-700 rounded-md py-2 px-3 text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-400 mb-1">Password</label>
                <input type="password" id="login-password" class="w-full bg-gray-800 border border-gray-700 rounded-md py-2 px-3 text-white focus:outline-none focus:border-indigo-500">
            </div>
            <button id="submit-login-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-md transition-colors">
                Log In
            </button>
            <p id="login-error" class="text-red-400 text-xs mt-3 hidden"></p>
        </div>
    </div>

    <!-- Custom Alert Modal -->
    <div id="alert-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black bg-opacity-75 p-4">
        <div class="glass-panel w-full max-w-sm rounded-xl p-6 modal-enter text-center">
            <div id="alert-icon" class="text-4xl mb-4 text-indigo-500"><i class="fas fa-info-circle"></i></div>
            <h3 id="alert-title" class="text-xl font-bold mb-2 text-white">Notice</h3>
            <p id="alert-message" class="text-gray-300 mb-6">Message goes here.</p>
            <button id="close-alert-btn" class="bg-gray-700 hover:bg-gray-600 text-white py-2 px-6 rounded-md transition-colors">OK</button>
        </div>
    </div>

    <!-- Confirm Delete Modal -->
    <div id="confirm-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black bg-opacity-75 p-4">
        <div class="glass-panel w-full max-w-sm rounded-xl p-6 modal-enter text-center shadow-2xl shadow-red-900/20">
            <div class="text-4xl mb-4 text-red-500"><i class="fas fa-exclamation-triangle"></i></div>
            <h3 id="confirm-title" class="text-xl font-bold mb-2 text-white">Delete Artwork?</h3>
            <p id="confirm-message" class="text-gray-300 mb-6">Are you sure you want to remove this image? This cannot be undone.</p>
            <div class="flex justify-center space-x-4">
                <button id="cancel-delete-btn" class="bg-gray-700 hover:bg-gray-600 text-white py-2 px-4 rounded-md transition-colors w-full">Cancel</button>
                <button id="confirm-delete-btn" class="bg-red-600 hover:bg-red-700 text-white py-2 px-4 rounded-md transition-colors w-full flex justify-center items-center">
                    <span id="confirm-action-label">Delete</span>
                    <i id="delete-spinner" class="fas fa-spinner fa-spin ml-2 hidden"></i>
                </button>
            </div>
        </div>
    </div>

    <footer class="border-t border-gray-800 mt-auto py-6 text-center text-gray-500 text-sm relative z-10">
        <p id="secret-login-trigger" class="cursor-pointer select-none hover:text-gray-400 transition-colors">&copy; 2026 MysteGUI Commissions.</p>
        <button id="logout-btn" class="hidden mt-2 text-indigo-400 hover:text-indigo-300 underline mx-auto block">Log Out</button>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        // FIX 2: Added writeBatch to imports
        import { getFirestore, collection, addDoc, onSnapshot, query, deleteDoc, doc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
  		    apiKey: "AIzaSyDMLKZgES04mUlJ1ygbPUUl1mTz5U-1wtE",
  		    authDomain: "mystegui-portfolio-ec024.firebaseapp.com",
  		    projectId: "mystegui-portfolio-ec024",
  		    storageBucket: "mystegui-portfolio-ec024.firebasestorage.app",
  		    messagingSenderId: "226274273666",
  		    appId: "1:226274273666:web:1cba5871a850830b9f479b"
	    };

        // FIX 1: Security - Define authorized admin UID here
        const ADMIN_UID = "REPLACE_WITH_YOUR_ADMIN_FIREBASE_UID"; 

        let app, auth, db;
        let currentUser = null;
        let isAdmin = false;
        let artworksData = []; 
        let isFirebaseActive = false;

        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            isFirebaseActive = true;

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    console.log("Logged in User UID:", user.uid); // Helps the user identify their UID in console
                    
                    // FIX 1: Verify the signed-in user against the specific Admin UID
                    if (ADMIN_UID === "REPLACE_WITH_YOUR_ADMIN_FIREBASE_UID") {
                        console.warn("SECURITY WARNING: Admin UID not set. Granting temporary access for setup. Update ADMIN_UID in code.");
                        isAdmin = true; 
                    } else {
                        isAdmin = (user.uid === ADMIN_UID);
                    }

                    if (isAdmin) {
                        currentUser = user;
                        const lBtn = document.getElementById('logout-btn');
                        if(lBtn) lBtn.classList.remove('hidden');
                    } else {
                        // User is authenticated but NOT the admin - kick them out
                        signOut(auth);
                        showAlert("Unauthorized", "You do not have administrative privileges.");
                    }
                } else {
                    currentUser = null;
                    isAdmin = false;
                    const lBtn = document.getElementById('logout-btn');
                    if(lBtn) lBtn.classList.add('hidden');
                }
                if(state.currentTab === 'portfolio') renderApp();
            });
        } catch(e) {
            console.error("Firebase failed to initialize:", e);
        }

        const state = {
            currentTab: 'portfolio',
            sortOrder: 'newest',
            currency: 'usd',
            calculator: { render: 'rendered', shot: 'bust', addons: [], commercial: false },
            orderItems: [],
            orderForm: { name: '', contact: '', refs: '', notes: '' }
        };

        const prices = {
            usd: {
                render: { lineart: { bust: 15, half: 25, thigh: 35, full: 50 }, greyscale: { bust: 25, half: 35, thigh: 45, full: 65 }, rendered: { bust: 35, half: 50, thigh: 65, full: 90 } },
                addons: { extra: 15, simpleBg: 10, complexBg: 20, rush: 15 }
            },
            php: {
                render: { lineart: { bust: 50, half: 80, thigh: 100, full: 130 }, greyscale: { bust: 70, half: 100, thigh: 120, full: 160 }, rendered: { bust: 100, half: 150, thigh: 160, full: 200 } },
                addons: { extra: 80, simpleBg: 50, complexBg: 100, rush: 75 }
            }
        };

        const mainContent = document.getElementById('main-content');
        const navTabs = document.querySelectorAll('.nav-tab');
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const uploadModal = document.getElementById('upload-modal');
        const alertModal = document.getElementById('alert-modal');
        const confirmModal = document.getElementById('confirm-modal');
        const loginModal = document.getElementById('login-modal');
        let itemToDelete = null;
        let deleteMode = 'single';

        function showAlert(title, message, isError = false) {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            const icon = document.getElementById('alert-icon');
            icon.innerHTML = isError ? '<i class="fas fa-exclamation-triangle"></i>' : '<i class="fas fa-info-circle"></i>';
            icon.className = `text-4xl mb-4 ${isError ? 'text-red-500' : 'text-indigo-500'}`;
            alertModal.classList.remove('hidden');
            alertModal.classList.add('flex');
        }
        
        document.getElementById('close-alert-btn').addEventListener('click', () => {
            alertModal.classList.add('hidden');
            alertModal.classList.remove('flex');
        });

        // FIX 4: Mobile-friendly Hidden Login Trigger
        const secretTrigger = document.getElementById('secret-login-trigger');
        let touchTimer;
        
        const triggerLoginModal = () => {
            if (!isAdmin) {
                loginModal.classList.remove('hidden');
                loginModal.classList.add('flex');
            }
        };

        // Desktop Double Click
        secretTrigger.addEventListener('dblclick', triggerLoginModal);
        
        // Mobile Long Press (~1.2s hold)
        secretTrigger.addEventListener('touchstart', (e) => {
            touchTimer = window.setTimeout(triggerLoginModal, 1200);
        }, { passive: true });
        secretTrigger.addEventListener('touchend', () => clearTimeout(touchTimer));
        secretTrigger.addEventListener('touchmove', () => clearTimeout(touchTimer));
        secretTrigger.addEventListener('touchcancel', () => clearTimeout(touchTimer));


        document.getElementById('close-login-btn').addEventListener('click', () => {
            loginModal.classList.add('hidden');
            loginModal.classList.remove('flex');
        });
        
        document.getElementById('submit-login-btn').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            const errDisplay = document.getElementById('login-error');
            if(!isFirebaseActive) return;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                loginModal.classList.add('hidden');
                loginModal.classList.remove('flex');
                errDisplay.classList.add('hidden');
                showAlert("Logged In", "Welcome back, MysteGUI. You can now manage your portfolio.");
            } catch (error) {
                errDisplay.innerText = "Invalid credentials.";
                errDisplay.classList.remove('hidden');
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            if(isFirebaseActive) await signOut(auth);
            showAlert("Logged Out", "You have been logged out securely.");
        });

        document.getElementById('cancel-delete-btn').addEventListener('click', () => {
            confirmModal.classList.add('hidden');
            confirmModal.classList.remove('flex');
            itemToDelete = null;
            deleteMode = 'single';
        });

        document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
            if (deleteMode === 'single' && !itemToDelete) return;
            const btn = document.getElementById('confirm-delete-btn');
            const spinner = document.getElementById('delete-spinner');
            btn.disabled = true;
            spinner.classList.remove('hidden');

            try {
                if (isFirebaseActive) {
                    if (deleteMode === 'all') {
                        // FIX 2: Batched operations for multiple deletes
                        const batch = writeBatch(db);
                        artworksData.forEach(art => {
                            batch.delete(doc(db, 'artworks', art.id));
                        });
                        await batch.commit();
                    } else {
                        await deleteDoc(doc(db, 'artworks', itemToDelete));
                    }
                }
                confirmModal.classList.add('hidden');
                confirmModal.classList.remove('flex');
                if(state.currentTab === 'portfolio') renderApp();
                showAlert(deleteMode === 'all' ? "Portfolio Cleared" : "Deleted", deleteMode === 'all' ? "All artwork has been removed from the gallery." : "Artwork has been removed from the gallery.");
            } catch (e) {
                console.error("Delete error", e);
                showAlert("Error", deleteMode === 'all' ? "Failed to delete all artwork." : "Failed to delete artwork.", true);
            } finally {
                btn.disabled = false;
                spinner.classList.add('hidden');
                itemToDelete = null;
                deleteMode = 'single';
            }
        });

        function listenToArtworks() {
            if (!isFirebaseActive) return;
            const q = query(collection(db, 'artworks'));
            onSnapshot(q, (snapshot) => {
                const fetched = [];
                snapshot.forEach((doc) => {
                    fetched.push({ id: doc.id, ...doc.data() });
                });
                artworksData = fetched;
                if (state.currentTab === 'portfolio') renderApp();
            }, (error) => {
                console.error("Firestore read error.", error);
            });
        }

        async function handleUpload() {
            if (!isAdmin || !isFirebaseActive) {
                showAlert("Unauthorized", "Only the owner can upload artworks.", true);
                return;
            }

            const titleInput = document.getElementById('upload-title');
            const urlInput = document.getElementById('upload-url');
            const title = titleInput.value.trim() || 'Untitled Artwork';
            const imageUrl = urlInput.value.trim();
            
            if (!imageUrl) {
                showAlert("Missing URL", "Please paste a direct link to your image.", true);
                return;
            }

            const btn = document.getElementById('submit-upload-btn');
            const spinner = document.getElementById('upload-spinner');
            btn.disabled = true;
            spinner.classList.remove('hidden');

            try {
                const img = new Image();
                img.onload = async () => {
                    const orientation = img.width > img.height ? 'landscape' : 'portrait';
                    await addDoc(collection(db, 'artworks'), {
                        title: title,
                        url: imageUrl,
                        orientation: orientation,
                        timestamp: Date.now()
                    });
                    
                    closeUploadModal();
                    showAlert("Success!", "Artwork published to your portfolio.");
                    btn.disabled = false;
                    spinner.classList.add('hidden');
                    titleInput.value = '';
                    urlInput.value = '';
                };
                
                img.onerror = () => {
                    showAlert("Invalid Image", "Could not load the image. Make sure it is a direct image link.", true);
                    btn.disabled = false;
                    spinner.classList.add('hidden');
                };
                
                img.src = imageUrl;
                
            } catch (error) {
                console.error("Upload error:", error);
                showAlert("Upload Failed", "Error saving to database.", true);
                btn.disabled = false;
                spinner.classList.add('hidden');
            }
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g,

            );
        }

        function getItemPrice(itemConfig, curr) {
            let basePrice = prices[curr].render[itemConfig.render][itemConfig.shot];
            if (itemConfig.commercial) basePrice *= 2;
            let addonTotal = 0;
            itemConfig.addons.forEach(addonId => { addonTotal += prices[curr].addons[addonId]; });
            return basePrice + addonTotal;
        }

            let grandTotal = 0;
            const sym = state.currency === 'usd' ? '$' : '₱';

            state.orderItems.forEach((item, idx) => {
                const itemPrice = getItemPrice(item, state.currency);
                grandTotal += itemPrice;
                const renderLabel = item.render.charAt(0).toUpperCase() + item.render.slice(1);
                const shotLabel = item.shot.charAt(0).toUpperCase() + item.shot.slice(1);
                const addonLabels = { extra: 'Extra Character', simpleBg: 'Simple Background', complexBg: 'Complex Background', rush: 'Rush Order' };
                const addonsFormatted = item.addons.length > 0 
                    ? item.addons.map(a => addonLabels[a]).join(', ') 
                    : 'None';
                const commercialLabel = item.commercial ? 'Yes (2x Base Price)' : 'No';

                orderSummary += `Item ${idx + 1}: ${renderLabel} ${shotLabel}\n`;
                orderSummary += `- Add-ons: ${addonsFormatted}\n`;
                orderSummary += `- Commercial Use: ${commercialLabel}\n`;
                orderSummary += `- Price: ${sym}${itemPrice}\n\n`;
            });

            const body = `Hello MysteGUI, I would like to request a commission!\n\n=== ORDER SUMMARY ===\n${orderSummary}GRAND TOTAL: ${sym}${grandTotal}\n\n=== CLIENT DETAILS ===\nName/Alias: ${name}\nContact Info: ${contact}\n\n=== REFERENCES & NOTES ===\nReferences:\n${refs}\n\nNotes:\n${notes}\n\n---------------------------------\nGenerated via MysteGUI Order Builder\n`;
            
            return {
                subject: `Commission Request: ${name} - ${state.orderItems.length} Item(s)`,
                bodyText: body
            };
        }

        function bindCalculatorEvents() {
            document.querySelectorAll('.curr-toggle').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    state.currency = e.target.dataset.curr;
                    renderApp();
                });
            });

            const formFields = ['name', 'contact', 'refs', 'notes'];
            formFields.forEach(f => {
                const el = document.getElementById(`order-${f}`);
                if (el) {
                    el.addEventListener('input', (e) => {
                        state.orderForm[f] = e.target.value;
                    });
                }
            });

            document.querySelectorAll('.calc-input').forEach(input => {
                input.addEventListener('change', (e) => {
                    if (e.target.name === 'render') state.calculator.render = e.target.value;
                    if (e.target.name === 'shot') state.calculator.shot = e.target.value;
                    if (e.target.name === 'addon') {
                        if (e.target.checked && !state.calculator.addons.includes(e.target.value)) {
                            state.calculator.addons.push(e.target.value);
                        } else if (!e.target.checked) {
                            state.calculator.addons = state.calculator.addons.filter(a => a !== e.target.value);
                        }
                    }
                    updateConfigTotal();
                });
            });
            
            const commToggle = document.getElementById('calc-commercial');
            if (commToggle) {
                commToggle.addEventListener('change', (e) => {
                    state.calculator.commercial = e.target.checked;
                    updateConfigTotal();
                });
            }

            const addBtn = document.getElementById('add-to-order-btn');
            if (addBtn) {
                addBtn.addEventListener('click', () => {
                    state.orderItems.push(JSON.parse(JSON.stringify(state.calculator)));
                    state.calculator = { render: 'rendered', shot: 'bust', addons: [], commercial: false };
                    renderApp();
                });
            }

            document.querySelectorAll('.delete-item-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(e.currentTarget.dataset.index);
                    state.orderItems.splice(idx, 1);
                    renderApp();
                });
            });

            // FIX 3: Copy to Clipboard Logic
            const copyOrderBtn = document.getElementById('copy-order-btn');
            if (copyOrderBtn && state.orderItems.length > 0) {
                copyOrderBtn.addEventListener('click', () => {
                    const orderData = buildOrderText();
                    navigator.clipboard.writeText(`Subject: ${orderData.subject}\n\n${orderData.bodyText}`)
                        .then(() => showAlert("Copied!", "Order details copied to clipboard. You can now paste this directly into your email."))
                        .catch(() => showAlert("Failed", "Could not copy text to clipboard.", true));
                });
            }

            const submitOrderBtn = document.getElementById('submit-order-btn');
            if (submitOrderBtn && state.orderItems.length > 0) {
                submitOrderBtn.addEventListener('click', () => {
                    const orderData = buildOrderText();
                    const encSubject = encodeURIComponent(orderData.subject);
                    const encBody = encodeURIComponent(orderData.bodyText);
                    window.location.href = `mailto:MysteGUIOfficial@gmail.com?subject=${encSubject}&body=${encBody}`;
                });
            }
            updateConfigTotal();
        }

        function getSocialsHTML() {
            const socials = [
                { name: "YouTube", icon: "fab fa-youtube", color: "hover:bg-red-600 hover:border-red-600", url: "https://www.youtube.com/@MysteGUIofficial323", text: "@MysteGUIofficial323" },
                { name: "Twitter / X", icon: "fab fa-twitter", color: "hover:bg-blue-400 hover:border-blue-400", url: "https://x.com/MysteGUICasual", text: "@MysteGUICasual" },
                { name: "Instagram", icon: "fab fa-instagram", color: "hover:bg-pink-600 hover:border-pink-600", url: "https://www.instagram.com/mystegui_official/?hl=en", text: "@mystegui_official" },
                { name: "Facebook", icon: "fab fa-facebook", color: "hover:bg-blue-600 hover:border-blue-600", url: "https://www.facebook.com/profile.php?id=61577494834616&sk=about", text: "MysteGUI" },
                { name: "Discord Server", icon: "fab fa-discord", color: "hover:bg-indigo-500 hover:border-indigo-500", url: "https://discord.gg/79hgWqGukp", text: "Join the Community" },
                { name: "Email", icon: "fas fa-envelope", color: "hover:bg-gray-500 hover:border-gray-500", url: "mailto:MysteGUIOfficial@gmail.com", text: "MysteGUIOfficial@gmail.com" }
            ];

            return `
                <div class="max-w-4xl mx-auto text-center py-8">
                    <h1 class="text-4xl font-extrabold text-white mb-4">Connect With Me</h1>
                    <p class="text-gray-400 mb-10">Follow me on social media, join the Discord, or reach out via email for business inquiries!</p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        ${socials.map(s => `
                            <a href="${s.url}" target="_blank" rel="noopener noreferrer" class="glass-panel border border-transparent p-5 rounded-xl flex items-center space-x-4 text-gray-300 transition-all duration-300 hover:text-white ${s.color} hover:shadow-lg transform hover:-translate-y-1 group">
                                <div class="w-12 h-12 flex items-center justify-center bg-gray-800 rounded-full text-2xl group-hover:bg-white/20 transition-colors">
                                    <i class="${s.icon}"></i>
                                </div>
                                <div class="text-left overflow-hidden">
                                    <span class="block font-bold text-lg truncate">${s.name}</span>
                                    <span class="block text-sm opacity-80 truncate">${s.text}</span>
                                </div>
                            </a>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        
        function openDeleteConfirm(mode, artworkId = null) {
            deleteMode = mode;
            itemToDelete = artworkId;
            const isAll = mode === 'all';
            document.getElementById('confirm-title').innerText = isAll ? 'Delete All Artwork?' : 'Delete Artwork?';
            document.getElementById('confirm-message').innerText = isAll
                ? 'This will permanently remove every artwork in your portfolio. This cannot be undone.'
                : 'Are you sure you want to remove this image? This cannot be undone.';
            document.getElementById('confirm-action-label').innerText = isAll ? 'Delete All' : 'Delete';
            confirmModal.classList.remove('hidden');
            confirmModal.classList.add('flex');
        }

        function bindPortfolioEvents() {
            document.querySelectorAll('.delete-art-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openDeleteConfirm('single', e.currentTarget.dataset.id);
                });
            });

            ['delete-all-btn', 'delete-all-btn-mobile'].forEach(id => {
                const btn = document.getElementById(id);
                if (btn) btn.addEventListener('click', () => openDeleteConfirm('all'));
            });

            const sortSelect = document.getElementById('sort-select');
            if (sortSelect) {
                sortSelect.addEventListener('change', (e) => {
                    state.sortOrder = e.target.value;
                    renderApp();
                });
            }
        }

        function renderApp() {
            navTabs.forEach(tab => {
                if (tab.dataset.tab === state.currentTab) {
                    tab.classList.remove('text-gray-300', 'hover:bg-gray-700');
                    tab.classList.add('text-white', 'bg-gray-800');
                } else {
                    tab.classList.remove('text-white', 'bg-gray-800');
                    tab.classList.add('text-gray-300', 'hover:bg-gray-700');
                }
            });

            if (state.currentTab === 'portfolio') {
                mainContent.innerHTML = getPortfolioHTML();
                const btn1 = document.getElementById('open-upload-btn');
                const btn2 = document.getElementById('open-upload-btn-mobile');
                if (btn1) btn1.addEventListener('click', openUploadModal);
                if (btn2) btn2.addEventListener('click', openUploadModal);
                bindPortfolioEvents();
            } else if (state.currentTab === 'commissions') {
                mainContent.innerHTML = getCommissionsHTML();
                bindCalculatorEvents();
            } else if (state.currentTab === 'socials') {
                mainContent.innerHTML = getSocialsHTML();
            }
        }

        navTabs.forEach(tab => {
            tab.addEventListener('click', (e) => {
                state.currentTab = e.target.dataset.tab;
                renderApp();
                mobileMenu.classList.add('hidden');
            });
        });
        
        mobileMenuBtn.addEventListener('click', () => { mobileMenu.classList.toggle('hidden'); });

        function openUploadModal() {
            uploadModal.classList.remove('hidden');
            uploadModal.classList.add('flex');
        }
        function closeUploadModal() {
            uploadModal.classList.add('hidden');
            uploadModal.classList.remove('flex');
        }
        document.getElementById('close-modal-btn').addEventListener('click', closeUploadModal);
        document.getElementById('submit-upload-btn').addEventListener('click', handleUpload);

        renderApp();
        listenToArtworks();

    </script>
</body>
</html>
